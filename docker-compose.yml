services:
  lifeline-edge:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lifeline-edge
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LIFELINE_NODE_ID=edge_node_alpha
      - LIFELINE_API_KEY=${LIFELINE_API_KEY:?set LIFELINE_API_KEY in .env}
      - LIFELINE_ADMIN_KEY=${LIFELINE_ADMIN_KEY:-}
      - LIFELINE_SERVER_URL=${LIFELINE_SERVER_URL:-}
      - LIFELINE_CORS_ORIGINS=${LIFELINE_CORS_ORIGINS:-http://localhost:8000}
    volumes:
      # Runtime state and Qdrant Edge shards persist across container rebuilds.
      - lifeline-runtime:/app/data/runtime
      - lifeline-shards:/app/data/edge_shards

volumes:
  lifeline-runtime:
  lifeline-shards:
